name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (tag or SHA)'
        required: false
        default: ''

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evpn-ninja
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
